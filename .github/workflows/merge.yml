name: Merge DNS Blacklist
run-name: Auto merge blacklists
on:
  schedule:
    - cron: '0 */12 * * *'
  # 支持手动在网页触发运行
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run merge script
        run: |
          chmod +x merge.py
          python3 merge.py

      - name: Commit & Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "自动获取dns列表去重整合 $(date +'%Y-%m-%d %H:%M')"
          git push
